name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python tests
        env:
          AUTH_BACKEND: local
          RAG_BACKEND: local
          RATE_LIMIT_ENABLED: "false"
          RESEND_API_KEY: ""
          SMTP_HOST: ""
          RAG_API_KEYS: test-api-key
          COOKIE_SECURE: "false"
        run: pytest -q

      - name: Check production config script syntax
        run: python -m py_compile scripts/check_production_config.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: magicui-frontend/package-lock.json

      - name: Install Magic UI frontend dependencies
        working-directory: magicui-frontend
        run: npm ci

      - name: Check Magic UI frontend
        working-directory: magicui-frontend
        run: npm run check

      - name: Validate Docker Compose
        run: |
          touch .env
          docker compose config --quiet
